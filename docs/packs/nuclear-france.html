<style>

/* bill comparator */

input[type=range]{width:100%;accent-color:var(--navy)}

/* outbox / footer bar */
.dock{position:fixed;bottom:0;left:0;right:0;background:var(--navy);z-index:60}
.dock-in{max-width:680px;margin:0 auto;display:flex}

/* modal */
.modal{display:none;position:fixed;inset:0;background:rgba(20,24,32,.55);z-index:100}

.modal-in h3{font-family:'Arial Narrow',Arial,sans-serif;text-transform:uppercase;

.ob-item{border:1px solid var(--line);background:var(--card);padding:10px;margin:8px 0;

.ob-q{font-weight:700}
.ob-a{font-style:italic;color:var(--ink2);margin:4px 0}

.ob-status{font-size:11px;letter-spacing:.15em}

  padding:6px 10px;cursor:pointer}

.phrase{border-bottom:1px solid var(--line);padding:8px 0;font-size:15px}

hr.rule{border:none;border-top:1px solid var(--line);margin:20px 0}
.toast{position:fixed;left:50%;bottom:64px;transform:translateX(-50%);
  background:var(--navy);color:#fff;padding:10px 16px;font-size:14px;z-index:200;
  max-width:92%;text-align:center;box-shadow:0 3px 10px rgba(0,0,0,.3);
  opacity:0;transition:opacity .3s}

.refline{font-size:14px;margin:10px 0;word-break:break-word}
.refline a{color:var(--bleu)}

<script id="pack">
/* ============ PACK: nuclear-france ============ */
const PACK = {
meta:{id:"nuclear-france",region:"Provence",title:"La France Nucléaire",
  ranks:[[0,"STAGIAIRE"],[120,"INGÉNIEUR(E)"],[260,"DIRECTEUR/TRICE"],[400,"MINISTRE"]],
  maxPts:565},
phrases:[
  ["Combien ça coûte ?","How much does it cost?"],
  ["C'est encore loin ?","Is it still far?"],
  ["On peut se baigner ici ?","Can we swim here?"],
  ["Qu'est-ce que c'est, ça ?","What is that thing?"],
  ["Je voudrais une glace, s'il vous plaît.","I'd like an ice cream, please."]
],
sections:[
/* ---------- 1 ---------- */
{id:"pari",num:"PIÈCE N°1",title:"Le Pari",en:"The Bet (1973–1974)",
vocab:[["le pétrole","oil"],["le charbon","coal"],["la crise","the crisis"],["une idée","an idea"]],
body:[
"October 1973. Arab oil producers cut exports to punish countries that supported Israel in the Yom Kippur War. The price of {{le pétrole||oil}} quadruples in five months. France is in serious trouble: it has almost no oil of its own, little natural gas, and its {{le charbon||coal}} mines are nearly exhausted. About three-quarters of the energy France uses is imported. Lights, factories, jobs — all depend on tankers arriving from countries that just proved they could turn off the tap.",
"In March 1974, Prime Minister Pierre Messmer announces one of the biggest industrial bets any country has ever made: France will build nuclear reactors — dozens of them, as fast as possible — so that its electricity no longer depends on anyone else. The government slogan becomes famous: <b>« En France, on n'a pas de pétrole, mais on a des idées. »</b> — <i>In France, we don't have oil, but we have ideas.</i>",
"Notice what the bet was actually about. Not climate change — almost nobody was talking about CO₂ in 1974. It was about <b>energy security</b>: never again being at the mercy of an embargo. The climate benefits came later, by accident. Your first task, Minister: face the same choice they faced."
],
interactive:"decision",
questions:[
{t:"mcq",q:"Why was France hit especially hard by the 1973 oil shock?",
 opts:["Its power plants were too old","It imported about 75% of its energy and had few fossil resources of its own","Its population was growing too fast","It had banned coal mining for environmental reasons"],
 a:1,expl:"France had almost no domestic oil or gas and declining coal — roughly three-quarters of its energy arrived by tanker. The embargo exposed exactly that weakness."},
{t:"mcq",q:"The Messmer Plan's real goal in 1974 was…",
 opts:["Fighting climate change","Creating jobs in construction","Energy independence — security from embargoes","Selling reactors to other countries"],
 a:2,expl:"It was a national-security decision. The low-carbon grid it produced was a side effect nobody was aiming for — arguably history's luckiest accident of energy policy."},
{t:"mcq",q:"« On n'a pas de pétrole, mais on a des idées » literally means…",
 opts:["We have no oil, but we have ideas","We need no oil, we have water","We have no money, but we have oil","No oil, no problem"],
 a:0,expl:"Bonus French: « on » here means 'we' — you'll hear it constantly in spoken French instead of « nous »."}
]},
/* ---------- 2 ---------- */
{id:"serie",num:"PIÈCE N°2",title:"La Série",en:"How they scaled it",
vocab:[["une centrale nucléaire","a nuclear power plant"],["pareil","the same"],["le chantier","the construction site"],["la puissance","power/output"]],
body:[
"Here is the decision that made the whole thing work: <b>build the same reactor over and over</b>. France licensed one proven American design (from Westinghouse) and built it in standardized series — first 34 reactors of 900 MW, then 20 of 1300 MW, then 4 of 1450 MW. Fifty-plus reactors, essentially three models.",
"Why does {{pareil||the same}} matter so much? Every copy shares spare parts. A technician trained at one {{une centrale nucléaire||nuclear plant}} can work at any other. The safety regulator masters one design instead of fifty. And every {{le chantier||construction site}} learns from the mistakes of the previous one, so each copy gets faster and cheaper to build. Engineers call this the <b>learning curve</b>. Compare the USA, where utilities built dozens of unique, customized designs — and costs went up instead of down.",
"At its peak France connected four to six reactors per year. In about 15 years, a country of 55 million people replaced most of its fossil electricity. It remains the fastest large-scale decarbonization of a power grid ever achieved. Try to beat their record yourself below — you have a budget, a deadline, and two ways to build."
],
interactive:"simulator",
questions:[
{t:"mcq",q:"Why did building identical copies make each reactor cheaper?",
 opts:["The government hid the real costs","Workers, factories and regulators repeat and improve the same tasks — the learning curve","Copies use less concrete","Uranium got cheaper over time"],
 a:1,expl:"Repetition drives cost down: shared parts, transferable crews, one regulator learning one design, each site improving on the last."},
{t:"mcq",q:"Roughly how much of France's electricity comes from nuclear today?",
 opts:["About 20%","About 40%","About 70%","Nearly 100%"],
 a:2,expl:"About 70% — the highest share of any country in the world. (Most of the rest is hydro and other renewables.)"},
{t:"selfcheck",q:"In your own words: why did reactor costs FALL in France during the 1980s while they ROSE in the USA at the same time?",
 model:"France built standardized series of one licensed design, so every plant benefited from shared parts, experienced crews, a regulator that knew the design, and lessons from the previous site (learning curve). US utilities each built bespoke, customized designs, so almost every plant was a first-of-a-kind — no repetition, no learning curve, plus changing regulations forced redesigns mid-construction."}
]},
/* ---------- 3 ---------- */
{id:"economie",num:"PIÈCE N°3",title:"L'Économie",en:"The 19-cent mystery",
vocab:[["la facture","the bill"],["les impôts","taxes"],["le réseau","the grid/network"],["ça coûte cher","that's expensive"],["le marché","the market"]],
body:[
"A puzzle, Minister — and this one is real. In 2026 the French energy regulator (the CRE) calculated exactly what it costs EDF to produce one kilowatt-hour from the existing reactor fleet. Everything counted: uranium, staff, repairs, waste storage, even the vast <i>Grand Carénage</i> programme to extend the reactors' lives. The answer: <b>€60.3 per MWh</b> — about <b>6.9 US cents per kWh</b>.",
"Now open a French {{la facture||bill}}. A household pays roughly <b>26 cents</b> for that same kilowatt-hour. Something multiplied the price by nearly <b>four</b> between the reactor and the wall socket. Before you read on, take the cost stack below apart and find it.",
"Here is where the money goes. {{les impôts||Taxes}} are the single biggest slice — about a third of the bill. There's an excise tax on every kWh, a small charge (the CTA) that funds pensions for energy workers, and then 20% VAT applied on top of everything, <i>including on the other taxes</i>. Next comes {{le réseau||the network}}: roughly a quarter of the bill pays RTE's 105,000 km of high-voltage lines and Enedis's 1.4 million km of local cables. Wires are expensive no matter what generates the power.",
"That leaves the strangest slice: the gap between what the electricity <i>costs</i> (6.9¢) and what suppliers <i>charge</i> for it (about 11.4¢). Until 31 December 2025, a law called ARENH forced EDF to sell a large share of its nuclear output at a fixed low price. That law expired. Since 1 January 2026, EDF sells on {{le marché||the market}} instead — and European electricity markets are priced by the <b>most expensive plant needed at that moment</b>, which is usually a gas plant. So France now <b>produces electricity like a nuclear country and prices it like a gas country</b>. The profit — the 'nuclear rent' — flows to EDF and, through a claw-back tax, to the state. Not to your socket.",
"The lesson is bigger than electricity, and it is the point of this whole Pièce: <b>a cheap way to make something does not automatically produce a cheap price.</b> Who captures the difference is decided by market rules, tax law and politics. Test it yourself with the buttons below — one of the results should genuinely surprise you."
],
interactive:"coststack",
questions:[
{t:"mcq",q:"Which is the SMALLEST slice of a French household electricity bill?",
 opts:["Taxes","The network (grid)","The actual cost of producing the electricity","The supplier's market premium"],
 a:2,expl:"Production — 6.9¢ of a ~26¢ bill. The thing everyone argues about is the cheapest part of it."},
{t:"mcq",q:"Since ARENH ended on 1 January 2026, French suppliers buy their electricity…",
 opts:["Directly from reactors at cost price","On the open market, where prices are set largely by gas plants","From the government at a fixed rate","From other countries only"],
 a:1,expl:"On the market. Because European prices are set by the last (most expensive) plant needed, gas still shapes the price in a country running on nuclear."},
{t:"mcq",q:"If French reactors produced electricity completely FREE, roughly how much would a household bill fall?",
 opts:["About 90%","About 65%","About 39%","Almost nothing"],
 a:2,expl:"Only ~39%. Nearly two-thirds of what you pay isn't the electricity — it's wires, margin and tax. Try it on the stack above."},
{t:"selfcheck",q:"France produces electricity more cheaply than almost anyone, yet French households don't pay unusually low prices. Is that unfair, or is there a good argument for it? Give the best case for BOTH sides.",
 model:"Against: consumers funded the reactors through decades of taxes and bills, so the cheap power arguably belongs to them; high energy prices hurt poorer households most. For: the money doesn't vanish — it funds EDF's €460bn investment programme, pays down debt, finances new EPR2 reactors and life-extension work that keeps the fleet running, and the tax revenue funds public services everyone uses. Charging below cost would also encourage waste and would leave nothing to rebuild the fleet when it retires. A strong answer notes that this is a distribution question — the same money, different pockets — not a question about nuclear technology at all."},
{t:"ai",qid:"ai-econ",q:"⚡ MINISTER'S BRIEF: A journalist says: « If your nuclear power costs 6.9 cents to make, why am I paying 26? » Answer them (4–8 sentences). Name at least THREE things that sit between the reactor and the bill, and be honest about which ones are genuine costs and which are political choices.",

<script id="engine">
/* ============ ENGINE ============ */
const CONFIG = {
  aiEndpoint: "https://api.anthropic.com/v1/messages", // swap for your proxy when self-hosted
  aiModel: "claude-sonnet-4-6"
};
const S = { profile:null, pts:0, done:{}, secDone:{}, outbox:[], simRuns:0 };

/* ---- local persistence ---- */
const STORE=(()=>{
  let ok=false;
  try{localStorage.setItem("__mp","1");localStorage.removeItem("__mp");ok=true;}catch(e){ok=false;}
  const K="missionpack:"+PACK.meta.id;
  return{ok,
    save(o){if(!ok)return false;try{localStorage.setItem(K,JSON.stringify(o));return true;}catch(e){return false;}},
    load(){if(!ok)return null;try{return JSON.parse(localStorage.getItem(K)||"null");}catch(e){return null;}},
    clear(){if(!ok)return;try{localStorage.removeItem(K);}catch(e){}}};
})();
let persistTimer=null, wiped=false;
function persist(){
  if(!STORE.ok||wiped)return;
  clearTimeout(persistTimer);
  persistTimer=setTimeout(()=>STORE.save(S),250);
}
function persistNow(){if(STORE.ok&&!wiped)STORE.save(S);}
addEventListener("visibilitychange",()=>{if(document.hidden)persistNow();});
addEventListener("pagehide",persistNow);
function toast(msg){
  const t=document.createElement("div");t.className="toast";t.textContent=msg;
  document.body.appendChild(t);requestAnimationFrame(()=>t.classList.add("show"));
  setTimeout(()=>{t.classList.remove("show");setTimeout(()=>t.remove(),350);},3200);
}

const $ = id => document.getElementById(id);
const esc = t => t.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");

/* ---- vocab markup: {{fr||en}} -> tap-to-reveal ---- */
function fmt(t){
  return t.replace(/\{\{(.+?)\|\|(.+?)\}\}/g,
    (_,fr,en)=>`<span class="v" onclick="this.classList.add('revealed');this.querySelector('.en').style.display='inline'">${fr} <span class="en" style="display:none">(${en})</span></span>`);
}

/* ---- points ---- */
function addPts(n, el){
  S.pts += n;
  renderGauge();
  persist();
  if(el){ const s=document.createElement("span"); s.className="pts-pop";
    s.textContent=" +"+n+" pts"; el.appendChild(s); }
}
function rank(){
  let r=PACK.meta.ranks[0][1];
  for(const [min,name] of PACK.meta.ranks) if(S.pts>=min) r=name;
  return r;
}
function renderGauge(){
  $("ptsLbl").textContent = S.pts+" pts";
  $("gaugeFill").style.width = Math.min(100, S.pts/PACK.meta.maxPts*100)+"%";
  $("rankLbl").textContent = rank();
}

/* ---- navigation ---- */
function showHome(){
  $("home").style.display="block"; $("secView").innerHTML="";
  renderTOC(); window.scrollTo(0,0);
}
function renderTOC(){
  const toc=$("toc"); toc.innerHTML="";
  PACK.sections.forEach((sec,i)=>{
    const doneQ = sec.questions.filter(q=>S.done[qKey(sec,q)]).length;
    const b=document.createElement("button"); b.className="toc-item";
    b.innerHTML=`<span class="toc-num mono">${sec.num}</span>
      <span class="toc-t"><b>${sec.title}</b><i>${sec.en}</i></span>
      <span class="toc-pts mono">${doneQ}/${sec.questions.length}</span>
      <span class="toc-st">${S.secDone[sec.id]?"✅":"📄"}</span>`;
    b.onclick=()=>showSection(i);
    toc.appendChild(b);
  });
  $("phraseBox").innerHTML = PACK.phrases.map(p=>
    `<div class="phrase">« ${p[0]} »<i>${p[1]}</i></div>`).join("");
}
function qKey(sec,q){ return sec.id+"::"+(q.qid||q.q.slice(0,40)); }

function showSection(i){
  const sec=PACK.sections[i];
  $("home").style.display="none";
  const v=$("secView");
  let bodyHtml = sec.body.map(p=>{
    if(p==="REFS") return PACK.refs.map(r=>
      `<div class="refline">▸ <a href="${r[1]}" target="_blank" rel="noopener">${r[0]}</a><br><span class="mono" style="font-size:11px;color:var(--ink2)">${r[1]}</span></div>`).join("");
    return `<p>${fmt(p)}</p>`;
  }).join("");
  const vocabHtml = sec.vocab.length ?
    `<div class="vocab-box"><b class="mono">VOCABULAIRE — tap the dotted words above, then test yourself:</b><br>`+
    sec.vocab.map(v=>`<span class="v" onclick="this.querySelector('.en').style.display='inline'">${v[0]} <span class="en" style="display:none">= ${v[1]}</span></span>`).join(" · ")+`</div>`:"";
  v.innerHTML = `<div class="sec active">
    <button class="crumb" onclick="showHome()">← Sommaire</button>
    <div class="piece-tag mono">${sec.num}</div>
    <h2>${sec.title}</h2>
    <div class="fr-sub">${sec.en}</div>
    <div id="stampZone"></div>
    ${bodyHtml}${vocabHtml}
    <div id="inter"></div>
    <hr class="rule">
    <div id="qs"></div>
    <div style="display:flex;justify-content:space-between;margin-top:20px">
      <button class="btn alt" onclick="showHome()">← Sommaire</button>
      ${i<PACK.sections.length-1?`<button class="btn" onclick="showSection(${i+1})">Pièce suivante →</button>`:
        `<button class="btn red" onclick="openReport()">Générer le rapport</button>`}
    </div></div>`;
  renderInteractive(sec, $("inter"));
  renderQuestions(sec, $("qs"));
  if(S.secDone[sec.id]) $("stampZone").innerHTML='<span class="stamp mono">VALIDÉ ✔</span>';
  window.scrollTo(0,0);
}

/* ---- questions ---- */
function renderQuestions(sec, host){
  sec.questions.forEach(q=>{
    const key=qKey(sec,q), card=document.createElement("div"); card.className="card";
    if(q.t==="mcq"){
      card.innerHTML=`<div class="card-tag mono">QUESTION · 10 PTS</div>
        <div class="qtext">${esc(q.q)}</div>`;
      const doneInfo = S.done[key];
      q.opts.forEach((o,oi)=>{
        const b=document.createElement("button"); b.className="opt"; b.textContent=o;
        if(doneInfo){ b.disabled=true;
          if(oi===q.a) b.classList.add("right");
        } else b.onclick=()=>{
          if(S.done[key]) return;
          const first = !card.dataset.missed;
          if(oi===q.a){
            b.classList.add("right");
            card.querySelectorAll(".opt").forEach(x=>x.disabled=true);
            S.done[key]={pts:first?10:5};
            addPts(first?10:5, b);
            const e=document.createElement("div"); e.className="expl";
            e.textContent=q.expl; card.appendChild(e);
            checkSectionDone(sec);
          } else { b.classList.add("wrong"); b.disabled=true; card.dataset.missed=1; }
        };
        card.appendChild(b);
      });
      if(doneInfo){ const e=document.createElement("div"); e.className="expl";
        e.textContent=q.expl; card.appendChild(e); }
    }
    if(q.t==="selfcheck"){
      card.innerHTML=`<div class="card-tag mono">RÉPONSE LIBRE · AUTO-ÉVALUATION · MAX 8 PTS</div>
        <div class="qtext">${esc(q.q)}</div>
        <textarea placeholder="Write your answer first — no peeking."></textarea>
        <button class="btn alt">Reveal model answer</button><div class="sc-zone"></div>`;
      const ta=card.querySelector("textarea"), zone=card.querySelector(".sc-zone");
      card.querySelector("button").onclick=function(){
        if(ta.value.trim().length<20){ zone.innerHTML='<p class="note">Write at least a couple of sentences first.</p>'; return;}
        this.disabled=true; ta.disabled=true;
        zone.innerHTML=`<div class="model-ans"><b>Model answer:</b> ${esc(q.model)}</div>
          <p class="note">Honor system: how close were you?</p>`;
        [["Nailed it",8],["Mostly",5],["Missed it",2]].forEach(([lbl,p])=>{
          const b=document.createElement("button"); b.className="btn alt";
          b.style.marginRight="8px"; b.textContent=lbl+" (+"+p+")";
          b.onclick=()=>{ if(S.done[key])return;
            S.done[key]={pts:p,ans:ta.value}; addPts(p,b);
            zone.querySelectorAll(".btn").forEach(x=>x.disabled=true);
            checkSectionDone(sec); };
          zone.appendChild(b);
        });
      };
      if(S.done[key]){ ta.value=S.done[key].ans||""; ta.disabled=true;
        card.querySelector("button").disabled=true; }
    }
    if(q.t==="ai"){
      card.innerHTML=`<div class="card-tag ai mono">⚡ ÉVALUATION PAR IA · MAX 20 PTS · QUEUED UNTIL ONLINE</div>
        <div class="qtext">${esc(q.q)}</div>
        <textarea placeholder="Your best thinking — a real AI will grade this against a rubric when you reconnect."></textarea>
        <button class="btn">Queue for evaluation</button><div class="ai-zone"></div>`;
      const ta=card.querySelector("textarea"), zone=card.querySelector(".ai-zone");
      const existing = S.outbox.find(o=>o.qid===q.qid);
      if(existing){ ta.value=existing.answer; ta.disabled=true;
        card.querySelector("button").disabled=true;
        zone.innerHTML = obStatusHtml(existing); }
      card.querySelector("button").onclick=function(){
        if(ta.value.trim().length<40){ zone.innerHTML='<p class="note">This one deserves a real answer — write more.</p>'; return; }
        this.disabled=true; ta.disabled=true;
        S.outbox.push({qid:q.qid,q:q.q,rubric:q.rubric,answer:ta.value,status:"queued"});
        zone.innerHTML='<p class="note">✉ Queued. Open "À évaluer" when you have a connection.</p>';
        renderBadge();
      };
      host.appendChild(card); return;
    }
    host.appendChild(card);
  });
}
function checkSectionDone(sec){
  const core = sec.questions.filter(q=>q.t!=="ai");
  if(core.every(q=>S.done[qKey(sec,q)]) && !S.secDone[sec.id]){
    S.secDone[sec.id]=true;
    persist();
    const z=$("stampZone"); if(z) z.innerHTML='<span class="stamp mono">VALIDÉ ✔</span>';
  }
}
function obStatusHtml(o){
  if(o.status==="done") return `<div class="ob-fb"><b>${o.score}/20</b> — ${esc(o.feedback)}</div>`;
  if(o.status==="error") return `<p class="note">Evaluation failed — retry from the outbox.</p>`;
  return '<p class="note">✉ Queued for evaluation.</p>';
}
/* ---- interactives ---- */
function renderInteractive(sec, host){
  if(sec.interactive==="decision") return interDecision(host);
  if(sec.interactive==="simulator") return interSim(host, sec);
  if(sec.interactive==="coststack") return interStack(host);
  if(sec.interactive==="co2sort") return interCO2(host, sec);
}

function interDecision(host){
  host.innerHTML=`<div class="card"><div class="card-tag mono">DÉCISION · 1974 · +5 PTS</div>
  <div class="qtext">The oil is cut off. Choose France's strategy, Minister:</div>
  <div id="decOpts"></div><div id="decOut"></div></div>`;
  const outcomes={
    coal:"<b>Coal:</b> France's mines are nearly empty — you'd be importing coal instead of oil, swapping one dependency for another, plus acid rain and smog. Several countries chose this. Their grids are still dirty today.",
    nuke:"<b>Nuclear:</b> This is what France chose. Huge upfront cost, a 15-year construction marathon, and permanent waste responsibility — in exchange for independence and (accidentally) a nearly carbon-free grid.",
    renew:"<b>Renewables:</b> A visionary answer — 30 years too early. In 1974 solar panels were spacecraft equipment costing ~100× today's price, and grid-scale wind barely existed. Physically impossible at scale then; a real option now.",
    save:"<b>Efficiency & rationing:</b> France actually did this too (speed limits, heating rules, daylight saving). Necessary — but it shrinks the problem, it can't power a growing industrial country."};
  const d=host.querySelector("#decOpts");
  [["Dig for more coal","coal"],["Bet everything on nuclear","nuke"],
   ["Bet on solar & wind","renew"],["Ration energy & save","save"]].forEach(([lbl,k])=>{
    const b=document.createElement("button"); b.className="opt"; b.textContent=lbl;
    b.onclick=()=>{
      host.querySelector("#decOut").innerHTML=`<div class="expl">${outcomes[k]}</div>`;
      if(!S.done["dec1974"]){ S.done["dec1974"]={pts:5}; addPts(5,b); }
    };
    d.appendChild(b);
  });
}

function interSim(host, sec){
  host.innerHTML=`<div class="card"><div class="card-tag mono">SIMULATEUR · LE CHANTIER · UP TO 15 PTS</div>
  <div class="qtext">Build 10 reactors. Budget: 60 milliards de francs. Custom designs always cost 8; series copies start at 8 and get cheaper with practice.</div>
  <div class="sim-stats">
    <div class="sim-stat">BUDGET LEFT<b id="simBud">60</b></div>
    <div class="sim-stat">REACTORS<b id="simN">0 / 10</b></div>
    <div class="sim-stat">NEXT COPY COSTS<b id="simNext">8</b></div>
  </div>
  <div class="rbar" id="simBar"></div>
  <button class="btn" id="simCopy">Build series copy</button>
  <button class="btn alt" id="simCustom">Build custom design (8)</button>
  <button class="btn alt" id="simReset">Restart</button>
  <div class="sim-log mono" id="simLog"></div></div>`;
  let bud, n, copyCost, over;
  const log=m=>{const l=$("simLog");l.innerHTML=`<div>▸ ${m}</div>`+l.innerHTML};
  function reset(){ bud=60;n=0;copyCost=8;over=false;$("simBar").innerHTML="";
    for(let i=0;i<10;i++){const b=document.createElement("div");b.className="rblock";$("simBar").appendChild(b);}
    upd(); $("simLog").innerHTML=""; log("1974. The nation is watching, Minister."); }
  function upd(){ $("simBud").textContent=bud; $("simN").textContent=n+" / 10";
    $("simNext").textContent=copyCost;
    $("simCopy").disabled=$("simCustom").disabled=over||n>=10; }
  function build(cost, custom){
    if(over||n>=10) return;
    if(bud<cost){ over=true; log("BUDGET EXHAUSTED. The Assemblée Nationale is furious. Restart."); upd(); return;}
    bud-=cost; const blocks=$("simBar").children; blocks[n].classList.add("done");
    if(custom){ blocks[n].classList.add("custom"); log(`Custom design built: −${cost}. First-of-a-kind: no learning carried over.`);}
    else { log(`Series copy #${n+1} built: −${cost}. Crews got faster.`); copyCost=Math.max(4,copyCost-1); }
    n++;
    if(n===10){
      const key="sim10";
      log(`✔ FLEET COMPLETE with ${bud} left over. ${bud>=20?"Superb — you found the learning curve.":"Done — could you do it cheaper?"}`);
      if(!S.done[key]){ const p = bud>=20?15:8; S.done[key]={pts:p}; addPts(p, $("simLog")); }
      else if(bud>=20 && S.done[key].pts<15){ addPts(15-S.done[key].pts,$("simLog")); S.done[key].pts=15; }
    }
    upd();
  }
  $("simCopy").onclick=()=>build(copyCost,false);
  $("simCustom").onclick=()=>build(8,true);
  $("simReset").onclick=reset;
  reset();
}

function interStack(host){
  // ¢ USD/kWh. taxes recomputed proportionally to the pre-tax subtotal.
  const BASE={gen:6.9,mrg:4.5,net:6.5}, TAXRATE=8.2/17.9, NJRATE=0.066;
  const CATS=[["gen","Production cost","var(--ok)"],
              ["mrg","Supply premium","var(--bleu)"],
              ["net","Network (wires)","var(--amber)"],
              ["tax","Taxes","var(--rouge)"]];
  host.innerHTML=`<div class="card"><div class="card-tag mono">LA PILE DES COÛTS · UP TO 14 PTS</div>
  <div class="qtext">One kilowatt-hour, from reactor to socket. Tap a change and watch what actually moves.</div>
  <div style="display:flex;gap:14px;align-items:flex-end;margin:14px 0">
    <div id="stkCol" style="width:66px;flex:none;display:flex;flex-direction:column-reverse;
      border:1.5px solid var(--navy);background:var(--paper);position:relative"></div>
    <div style="flex:1;min-width:0" id="stkKey"></div>
  </div>
  <div style="display:flex;gap:6px;flex-wrap:wrap">
    <button class="btn alt" data-s="0">Reality (2026)</button>
    <button class="btn alt" data-s="1">Free reactors</button>

    <button class="btn alt" data-s="3">Both at once</button>
  </div>
  <div id="stkOut"></div></div>`;
  const SC=[
   {n:"Reality (2026)",gen:BASE.gen,rate:TAXRATE,
    m:"6.9¢ to produce. 26.1¢ to buy. Everything above the green block is what happens on the way."},
   {n:"Free reactors",gen:0,rate:TAXRATE,
    m:"Here is the surprise. Even if the electricity were completely FREE, the bill only falls about 39%. Nearly two-thirds of what a household pays is not the electricity at all — it is wires, margin and tax."},
   {n:"Tax like New Jersey",gen:BASE.gen,rate:NJRATE,
    m:"Swapping France's ~32% tax load for a New Jersey-style 6.6% sales tax cuts the bill about 27% — nearly as much as making the reactors free. Fiscal policy is a bigger lever than physics."},
   {n:"Both at once",gen:0,rate:NJRATE,
    m:"Free electricity AND low taxes still leaves ~11.7¢, because the wires and the supplier remain. Something always has to pay for 1.4 million km of cable."}
  ];
  let seen={};
  function draw(i){
    const sc=SC[i];
    const pre=sc.gen+BASE.mrg+BASE.net, tax=pre*sc.rate, tot=pre+tax;
    const vals={gen:sc.gen,mrg:BASE.mrg,net:BASE.net,tax:tax};
    const PX=8.4;
    $("stkCol").innerHTML=CATS.map(([k,,c])=>
      `<div style="background:${c};height:${vals[k]*PX}px;transition:height .45s ease"></div>`).join("")
      +`<div class="mono" style="position:absolute;top:-22px;left:0;right:0;text-align:center;
         font-weight:700;color:var(--navy)">${tot.toFixed(1)}¢</div>`;
    $("stkKey").innerHTML=CATS.map(([k,lbl,c])=>
      `<div style="display:flex;align-items:center;gap:7px;font-size:13px;margin:3px 0">
        <span style="width:13px;height:13px;background:${c};border:1px solid var(--ink);flex:none"></span>
        <span style="flex:1">${lbl}</span>
        <span class="mono">${vals[k].toFixed(1)}¢</span></div>`).join("");
    const base=BASE.gen+BASE.mrg+BASE.net; const baseTot=base+base*TAXRATE;
    const pct=Math.round((tot-baseTot)/baseTot*100);
    $("stkOut").innerHTML=`<div class="expl">${i?`<b class="mono">${pct}% vs reality.</b> `:""}${sc.m}</div>`;
    host.querySelectorAll("[data-s]").forEach(b=>
      b.style.borderWidth = b.dataset.s==String(i) ? "3px" : "1.5px");
    seen[i]=1;
    if(Object.keys(seen).length===4 && !S.done["coststack"]){
      S.done["coststack"]={pts:14}; addPts(14,$("stkOut"));
    }
  }
  host.querySelectorAll("[data-s]").forEach(b=>b.onclick=()=>draw(+b.dataset.s));
  draw(0);
}
function interCO2(host, sec){
  const items=[["Wind",11],["Nuclear",12],["Hydro",24],["Solar",45],["Natural gas",490],["Coal",820]];
  const shuffled=[...items].sort(()=>Math.random()-.5);
  host.innerHTML=`<div class="card"><div class="card-tag mono">DÉFI · G CO₂ / KWH · UP TO 12 PTS</div>
  <div class="qtext">Tap the sources in order, CLEANEST first (lifecycle emissions):</div>
  <div class="chips" id="coPool"></div>
  <div class="slots" id="coSlots"></div>
  <button class="btn" id="coCheck" disabled>Check order</button>
  <button class="btn alt" id="coReset">Reset</button>
  <div id="coOut"></div></div>`;
  let picked=[];
  function draw(){
    const pool=$("coPool"); pool.innerHTML="";
    shuffled.forEach(it=>{
      const b=document.createElement("button"); b.className="chip"; b.textContent=it[0];
      b.disabled=picked.some(p=>p[0]===it[0]);
      b.onclick=()=>{picked.push(it);draw();};
      pool.appendChild(b);
    });
    const slots=$("coSlots"); slots.innerHTML="";
    picked.forEach((it,i)=>{
      const c=document.createElement("button"); c.className="slot-chip";
      c.textContent=(i+1)+". "+it[0];
      c.onclick=()=>{picked.splice(i,1);draw();};
      slots.appendChild(c);
    });
    $("coCheck").disabled = picked.length!==items.length;
  }
  $("coReset").onclick=()=>{picked=[];$("coOut").innerHTML="";draw();};
  $("coCheck").onclick=()=>{
    let correct=0;
    const slots=$("coSlots").children;
    picked.forEach((it,i)=>{
      const ok = it[0]===items[i][0];
      slots[i].classList.add(ok?"good":"bad");
      slots[i].textContent=(i+1)+". "+it[0]+" ("+it[1]+"g)";
      if(ok) correct++;
    });
    const key="co2sort";
    const p=correct*2;
    $("coOut").innerHTML=`<div class="expl">${correct}/6 in place. The shock for most people: <b>nuclear ≈ wind</b>, both far below solar, and fossil gas is ~40× dirtier than nuclear even before methane leaks. (IPCC lifecycle medians.)</div>`;
    if(!S.done[key] || p>S.done[key].pts){
      const prev=S.done[key]?S.done[key].pts:0;
      S.done[key]={pts:p}; if(p>prev) addPts(p-prev,$("coOut"));
    }
  };
  draw();
}
/* ---- outbox / AI evaluation ---- */
function renderBadge(){
  persist();
  const q=S.outbox.filter(o=>o.status!=="done").length;
  $("obBadge").style.display=q?"inline-block":"none";
  $("obBadge").textContent=q;
}
function openOutbox(){
  const m=$("modalIn");
  let h=`<h3>À Évaluer — Answer Outbox</h3>`;
  if(!S.outbox.length) h+=`<p class="note">Nothing queued yet. The ⚡ questions in the dossier land here.</p>`;
  S.outbox.forEach(o=>{
    h+=`<div class="ob-item"><div class="ob-status mono">${o.status==="done"?"✔ ÉVALUÉ":o.status==="error"?"✖ ERREUR":o.status==="sending"?"… ENVOI":"✉ EN ATTENTE"}</div>
      <div class="ob-q">${esc(o.q)}</div><div class="ob-a">${esc(o.answer)}</div>
      ${o.status==="done"?`<div class="ob-fb"><b>${o.score}/20</b> — ${esc(o.feedback)}</div>`:""}</div>`;
  });
  const pending=S.outbox.filter(o=>o.status==="queued"||o.status==="error").length;
  h+=`<button class="btn" id="obSend" ${pending?"":"disabled"}>Evaluate ${pending} answer(s) now (needs connection)</button>
      <button class="btn alt" onclick="closeModal()">Close</button>
      <p class="note" id="obMsg"></p>`;
  m.innerHTML=h; $("modal").classList.add("open");
  const sb=$("obSend"); if(sb) sb.onclick=sendOutbox;
}
async function sendOutbox(){
  $("obMsg").textContent="Contacting the evaluator…";
  for(const o of S.outbox){
    if(o.status==="done") continue;
    o.status="sending";
    try{
      const resp=await fetch(CONFIG.aiEndpoint,{method:"POST",
        headers:{"Content-Type":"application/json"},
        body:JSON.stringify({model:CONFIG.aiModel,max_tokens:1000,messages:[{role:"user",
          content:`You are grading a bright 12-15 year old's answer in a learning game about French nuclear power. Question: "${o.q}"\nGrading rubric: ${o.rubric}\nStudent answer: "${o.answer}"\nRespond with ONLY a JSON object, no markdown fences, no preamble: {"score": <integer 0-20>, "feedback": "<2-4 encouraging but honest sentences: what was strong, what was missing, one thing to think about next>"}`}]})});
      const data=await resp.json();
      const txt=(data.content||[]).filter(c=>c.type==="text").map(c=>c.text).join("\n");
      const parsed=JSON.parse(txt.replace(/```json|```/g,"").trim());
      o.score=Math.max(0,Math.min(20,parseInt(parsed.score)||0));
      o.feedback=parsed.feedback||"Evaluated.";
      o.status="done";
      const key="ai::"+o.qid;
      if(!S.done[key]){ S.done[key]={pts:o.score}; S.pts+=o.score; renderGauge(); }
    }catch(e){ o.status="error"; }
  }
  renderBadge(); openOutbox();
  $("obMsg").textContent=S.outbox.some(o=>o.status==="error")?
    "Some evaluations failed — check your connection and retry.":"All evaluated. Scores added to your PUISSANCE.";
}
function closeModal(){ $("modal").classList.remove("open"); }

  $("modalIn").innerHTML=`<h3>Code de Sauvegarde</h3>
  <p class="note">Copy this code somewhere safe (notes app / message it to a parent). Paste it back here to restore your progress on any device or after closing the app.</p>

  <button class="btn" id="copyBtn">Copy code</button>
  <hr class="rule">
  <p class="note">Restore: paste a code above, then —</p>
  <button class="btn alt" id="loadBtn">Load pasted code</button>
  <button class="btn alt" onclick="closeModal()">Close</button>
  <hr class="rule">
  <p class="saveflag mono">${STORE.ok?"✔ AUTO-SAVE ACTIVE ON THIS DEVICE":"⚠ AUTO-SAVE UNAVAILABLE HERE — KEEP THE CODE ABOVE"}</p>
  <p class="note">Progress saves automatically as you go. The code is only needed to move to another device or browser.</p>
  <button class="btn red" id="resetBtn">Start over (erase progress)</button>
  <p class="note" id="saveMsg"></p>`;
  $("modal").classList.add("open");
  $("copyBtn").onclick=async()=>{ try{ await navigator.clipboard.writeText($("saveCode").value);
    $("saveMsg").textContent="Copied.";}catch(e){ $("saveCode").select();
    $("saveMsg").textContent="Select-all and copy manually."; } };
  $("resetBtn").onclick=()=>{
    if(!confirm("Erase all progress on this device and start over?"))return;
    wiped=true;clearTimeout(persistTimer);STORE.clear();location.reload();
  };
  $("loadBtn").onclick=()=>{ try{
      const obj=JSON.parse(decodeURIComponent(escape(atob($("saveCode").value.trim()))));
      Object.assign(S,obj); persistNow(); renderGauge(); renderBadge(); showHome(); closeModal();
    }catch(e){ $("saveMsg").textContent="That code didn't parse — check it copied fully."; } };
}
